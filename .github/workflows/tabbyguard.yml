name: TabbyGuard Live Website Test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  tabbyguard:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Example
            url: https://example.com/
            routes: /

          - name: The Internet
            url: https://the-internet.herokuapp.com/
            routes: /

          - name: Hopeful Fridays
            url: https://hopefulfridays.org/
            routes: /

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run TabbyGuard V3 release candidate
        id: tabbyguard
        uses: tabitha-dev/TabbyGuard@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preview-url: ${{ matrix.url }}
          routes: ${{ matrix.routes }}
          fail-on-severity: none
          post-comment: "false"
          upload-artifacts: "true"
          screenshot-mode: all

      - name: Show TabbyGuard result
        if: always()
        shell: bash
        run: |
          echo "Website: ${{ matrix.name }}"
          echo "URL: ${{ matrix.url }}"
          echo "Result: ${{ steps.tabbyguard.outputs.result }}"
          echo "Findings: ${{ steps.tabbyguard.outputs.findings-count }}"
          echo "Critical: ${{ steps.tabbyguard.outputs.critical-count }}"
          echo "High: ${{ steps.tabbyguard.outputs.high-count }}"
          echo "Medium: ${{ steps.tabbyguard.outputs.medium-count }}"
          echo "Low: ${{ steps.tabbyguard.outputs.low-count }}"
          echo "Report path: ${{ steps.tabbyguard.outputs.report-path }}"
          echo "Artifact URL: ${{ steps.tabbyguard.outputs.artifact-url }}"
